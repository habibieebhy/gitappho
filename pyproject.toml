[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitappho"
version = "7.0.0"
description = "Git without the complexity: five intentions, guided Git and GitHub workflows."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/habibieebhy/gitappho"

[project.scripts]
gitappho = "gitappho:cli"

[tool.setuptools]
py-modules = ["gitappho"]
package-dir = {"" = "shell"}
